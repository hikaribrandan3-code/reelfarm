<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ReelFarm brand motion</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:400px;height:400px;border:0;position:absolute;transform-origin:0 0}</style><iframe src="/motion/brand/index.html" title="ReelFarm animated brand mark" tabindex="-1"></iframe><script>const frame=document.querySelector('iframe');function size(){frame.style.transform=`scale(${innerWidth/400})`;}size();addEventListener('resize',size);let timeline;frame.addEventListener('load',()=>{timeline=frame.contentWindow.__timelines?.brand;if(!timeline)return;const query=matchMedia('(prefers-reduced-motion: reduce)');if(!query.matches)timeline.repeat(-1).play();const observer=new IntersectionObserver(([entry])=>{if(query.matches)return;entry.isIntersecting&&!document.hidden?timeline.play():timeline.pause();});observer.observe(frame);document.addEventListener('visibilitychange',()=>document.hidden?timeline.pause():!query.matches&&timeline.play());query.addEventListener('change',()=>query.matches?timeline.pause(0):timeline.play());});</script></html>
